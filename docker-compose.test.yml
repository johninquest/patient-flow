services:
  postgres:
    image: postgres:18.4-alpine
    container_name: patient-flow-postgres-test
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=patientflow
      - POSTGRES_PASSWORD=patientflow_dev_password
      - POSTGRES_DB=patientflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - patient-flow-test

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: patient-flow-api-test
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./apps/api/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://patientflow:patientflow_dev_password@postgres:5432/patientflow
      - API_URL=http://localhost:3000
      - CLIENT_URL=http://localhost:5173
    volumes:
      - ./apps/api:/app/apps/api
      - /app/node_modules
      - /app/apps/client/node_modules
    depends_on:
      - postgres
    networks:
      - patient-flow-test

  client:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    container_name: patient-flow-client-test
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/client:/app/apps/client
      - /app/node_modules
      - /app/apps/api/node_modules
    depends_on:
      - api
    networks:
      - patient-flow-test

volumes:
  postgres_data:

networks:
  patient-flow-test:
    driver: bridge